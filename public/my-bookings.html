<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your travel plans | Skyline Air</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="my-bookings">
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <nav aria-label="Main">
        <a class="brand" href="index.html">skyline<span>air.</span></a
        ><a href="index.html">Find a flight</a
        ><a href="my-bookings.html">My bookings</a
        ><a id="admin-link" class="hidden" href="admin.html">Operations</a>
        <div id="account" class="inline"></div>
      </nav>
    </header>
    <main id="main">
      <p class="muted notice">
        CLASSROOM DEMO · Fictional flights and passengers · No real payments
      </p>
      <div id="message" class="hidden" role="status" aria-live="polite"></div>
      <span class="eyebrow">SKYLINE AIR</span>
      <h1>Your travel plans</h1>
      <form id="lookup" class="card inline">
        <label
          >Booking reference<input
            name="reference"
            maxlength="16"
            placeholder="Optional reference" /></label
        ><button>Find booking</button><a href="my-bookings.html">Show all</a>
      </form>
      <section id="bookings">Loading bookings…</section>
    </main>
    <footer>
      Skyline Air · Systems analysis &amp; reservation analytics · All schedule
      times shown in UTC.
    </footer>
  </body>
</html>
