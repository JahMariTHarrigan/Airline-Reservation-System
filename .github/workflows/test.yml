name: MySQL integration checks
on: [push, pull_request, workflow_dispatch]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: skyline_air
          MYSQL_USER: skyline
          MYSQL_PASSWORD: ci-project-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure disposable CI database
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=skyline
          DB_PASSWORD=ci-project-only
          DB_NAME=skyline_air
          DEMO_PASSWORD=CI-synthetic-demo-password
          EOF
      - run: npm run setup
      - run: npm test
      - run: node --env-file=.env scripts/persistence-check.js
